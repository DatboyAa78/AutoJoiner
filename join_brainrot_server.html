<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Brainrot Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        h1::before {
            content: '🧠';
            font-size: 1.5rem;
        }
        p {
            font-size: 1rem;
            color: #d1d5db;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .input-container {
            margin-bottom: 24px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e7ff;
            font-size: 1rem;
            transition: background 0.2s;
        }
        input[type="text"]::placeholder {
            color: #9ca3af;
        }
        input[type="text"]:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
        }
        .status {
            font-size: 0.875rem;
            color: #d1d5db;
            min-height: 24px;
            margin-top: 16px;
        }
        button {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            position: relative;
            overflow: hidden;
        }
        button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s;
        }
        button:hover::after {
            left: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
            background: linear-gradient(90deg, #6b7280, #9ca3af);
        }
        button:active {
            transform: translateY(0);
        }
        @media (max-width: 480px) {
            .container {
                margin: 16px;
                padding: 24px;
            }
            h1 {
                font-size: 1.75rem;
            }
            button {
                font-size: 1rem;
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Join Brainrot Server</h1>
        <p>Join Rare Brainrot server</p>
        <div class="input-container">
            <input type="text" id="jobIdInput" placeholder="Enter Job ID (optional)">
        </div>
        <button onclick="joinServer()">Join Server Now</button>
        <p class="status" id="status"></p>
    </div>

    <script>
        const PLACE_ID = 109983668079237;  // Confirmed Place ID for the game

        // Get Job ID from URL parameter if present
        function getJobIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('jobId') || '';
        }

        // Set initial Job ID value from URL
        const jobIdInput = document.getElementById('jobIdInput');
        jobIdInput.value = getJobIdFromUrl();

        function joinServer() {
            const status = document.getElementById('status');
            const jobId = jobIdInput.value.trim() || getJobIdFromUrl();

            // Validate PLACE_ID
            if (!PLACE_ID || isNaN(PLACE_ID) || PLACE_ID <= 0) {
                status.textContent = '❌ Invalid Place ID!';
                status.style.color = '#f87171';
                return;
            }

            // Construct URLs
            let webUrl = `https://www.roblox.com/games/start?placeId=${PLACE_ID}`;
            let robloxUrl = `roblox://placeId=${PLACE_ID}`;
            
            if (jobId) {
                webUrl += `&jobId=${encodeURIComponent(jobId)}`;
                robloxUrl += `&jobId=${encodeURIComponent(jobId)}`;
            }

            status.textContent = '🚀 Redirecting to Roblox...';
            status.style.color = '#4ade80';

            // Attempt to open in Roblox client first
            try {
                window.location.href = robloxUrl;
                // Fallback to web URL after a short delay if the client doesn't open
                setTimeout(() => {
                    window.location.href = webUrl;
                }, 1500);
            } catch (error) {
                // If roblox:// fails, immediately try the web URL
                window.location.href = webUrl;
            }
        }
    </script>
</body>
</html>
