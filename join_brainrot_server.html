<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseas Hub Autojoiner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Original styles unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.05) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 80px rgba(120, 119, 198, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: slideIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            z-index: 1;
        }
        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        .logo {
            font-size: 3.5rem;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(96, 165, 250, 0.3));
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 32px;
            font-weight: 500;
            line-height: 1.5;
        }
        .feature-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.2);
            color: #60a5fa;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 32px;
        }
        .input-container {
            margin-bottom: 28px;
            text-align: left;
        }
        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.6);
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
            transform: translateY(-2px);
        }
        .status {
            font-size: 0.875rem;
            color: #94a3b8;
            min-height: 24px;
            margin-top: 20px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .status.success {
            color: #4ade80;
        }
        .status.error {
            color: #f87171;
        }
        .status.warning {
            color: #fbbf24;
        }
        button {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            color: #ffffff;
            border: none;
            padding: 18px 32px;
            font-size: 1.125rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 24px rgba(96, 165, 250, 0.3),
                0 2px 6px rgba(0, 0, 0, 0.1);
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.2), 
                transparent);
            transition: left 0.6s;
        }
        button:hover::before {
            left: 100%;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 32px rgba(96, 165, 250, 0.4),
                0 4px 12px rgba(0, 0, 0, 0.15);
        }
        button:active {
            transform: translateY(-1px);
        }
        button i {
            margin-right: 8px;
            font-size: 1.1em;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .info-item {
            text-align: center;
            padding: 16px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        .info-label {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 1rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-top: 4px;
        }
        .floating-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: rgba(96, 165, 250, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        @media (max-width: 520px) {
            .container {
                margin: 20px;
                padding: 32px 24px;
            }
            h1 {
                font-size: 2rem;
            }
            .logo {
                font-size: 2.8rem;
            }
            button {
                font-size: 1rem;
                padding: 16px 24px;
            }
            .info-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
        /* New styles for the convert button */
        .convert-button {
            background: linear-gradient(135deg, #34d399, #10b981);
            margin-top: 16px;
        }
        .convert-button:hover {
            box-shadow: 
                0 12px 32px rgba(52, 211, 153, 0.4),
                0 4px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="floating-particles" id="particles"></div>
    
    <div class="container">
        <div class="logo">
            <i class="fas fa-globe-americas logo-icon"></i>
        </div>
        <h1>Overseas Hub <span style="font-weight: 300;">🏄‍♂️</span></h1>
        <p class="subtitle">Professional Autojoiner for Premium Server Management</p>
        
        <div class="feature-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Advanced Server Detection</span>
        </div>

        <div class="input-container">
            <label class="input-label" for="hexInput">
                <i class="fas fa-code"></i> Hex Job ID
            </label>
            <input type="text" id="hexInput" placeholder="Enter hex string (e.g., 734F4970...)">
        </div>

        <button class="convert-button" onclick="convertHexToJobId()">
            <i class="fas fa-exchange-alt"></i> Convert to Job ID
        </button>

        <div class="input-container">
            <label class="input-label" for="jobIdInput">
                <i class="fas fa-hashtag"></i> Server Job ID (Optional)
            </label>
            <input type="text" id="jobIdInput" placeholder="Enter or convert to server Job ID...">
        </div>

        <button onclick="joinServer()">
            <i class="fas fa-rocket"></i> Launch Autojoiner
        </button>

        <p class="status" id="status">Ready to connect...</p>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-icon">🔍</div>
                <div class="info-label">Keyword Scan</div>
                <div class="info-value">Active</div>
            </div>
            <div class="info-item">
                <div class="info-icon">⚡</div>
                <div class="info-label">Auto Hop</div>
                <div class="info-value">Enabled</div>
            </div>
            <div class="info-item">
                <div class="info-icon">🛡️</div>
                <div class="info-label">Protection</div>
                <div class="info-value">Live</div>
            </div>
            <div class="info-item">
                <div class="info-icon">🌐</div>
                <div class="info-label">Servers</div>
                <div class="info-value">100+</div>
            </div>
        </div>
    </div>

    <script>
        const PLACE_ID = 109983668079237;

        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 60 + 20;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const delay = Math.random() * 5;
                const duration = Math.random() * 3 + 4;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.opacity = Math.random() * 0.1 + 0.05;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Get Job ID from URL parameter if present
        function getJobIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('jobId') || '';
        }

        // Convert hex string to formatted Job ID
        function convertHexToJobId() {
            const hexInput = document.getElementById('hexInput');
            const jobIdInput = document.getElementById('jobIdInput');
            const status = document.getElementById('status');
            const hex = hexInput.value.trim().toUpperCase();

            // Validate hex string
            if (!hex.match(/^[0-9A-F]+$/i)) {
                status.textContent = '❌ Invalid hex string! Use only 0-9 and A-F.';
                status.className = 'status error';
                return;
            }

            // Format hex string (e.g., group into 8-4-4-4-12 for UUID-like format)
            let formattedJobId = '';
            if (hex.length >= 32) {
                // Assuming a UUID-like format for readability
                formattedJobId = [
                    hex.slice(0, 8),
                    hex.slice(8, 12),
                    hex.slice(12, 16),
                    hex.slice(16, 20),
                    hex.slice(20, 32)
                ].join('-');
            } else {
                // For shorter strings, group by 4 characters
                formattedJobId = hex.match(/.{1,4}/g)?.join('-') || hex;
            }

            jobIdInput.value = formattedJobId;
            status.textContent = '✅ Hex converted to Job ID!';
            status.className = 'status success';

            // Reset status after 3 seconds
            setTimeout(() => {
                status.textContent = 'Ready to connect...';
                status.className = 'status';
            }, 3000);
        }

        // Set initial Job ID value from URL
        const jobIdInput = document.getElementById('jobIdInput');
        jobIdInput.value = getJobIdFromUrl();

        function joinServer() {
            const status = document.getElementById('status');
            const jobId = jobIdInput.value.trim() || getJobIdFromUrl();

            // Validate PLACE_ID
            if (!PLACE_ID || isNaN(PLACE_ID) || PLACE_ID <= 0) {
                status.textContent = '❌ Invalid Place ID!';
                status.className = 'status error';
                return;
            }

            // Validate Job ID format (optional, depending on your requirements)
            if (jobId && !jobId.match(/^[0-9A-F-]{36}$/i)) {
                status.textContent = '❌ Invalid Job ID format! Use converted Job ID or valid UUID.';
                status.className = 'status error';
                return;
            }

            // Construct URLs
            let webUrl = `https://www.roblox.com/games/start?placeId=${PLACE_ID}`;
            let robloxUrl = `roblox://placeId=${PLACE_ID}`;
            
            if (jobId) {
                webUrl += `&jobId=${encodeURIComponent(jobId)}`;
                robloxUrl += `&jobId=${encodeURIComponent(jobId)}`;
            }

            status.textContent = '🚀 Launching Overseas Hub Autojoiner...';
            status.className = 'status success';

            // Add loading animation to button
            const button = document.querySelector('button:not(.convert-button)');
            const originalText = button.innerHTML;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';
            button.disabled = true;

            // Attempt to open in Roblox client first
            try {
                window.location.href = robloxUrl;
                // Fallback to web URL after a short delay if the client doesn't open
                setTimeout(() => {
                    window.location.href = webUrl;
                }, 1500);
            } catch (error) {
                // If roblox:// fails, immediately try the web URL
                window.location.href = webUrl;
            }

            // Reset button after 3 seconds if still on page
            setTimeout(() => {
                button.innerHTML = originalText;
                button.disabled = false;
            }, 3000);
        }

        // Initialize particles when page loads
        document.addEventListener('DOMContentLoaded', createParticles);

        // Add enter key support for inputs
        jobIdInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                joinServer();
            }
        });

        document.getElementById('hexInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertHexToJobId();
            }
        });
    </script>
</body>
</html>
