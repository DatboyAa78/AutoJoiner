<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseas Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2e, #2a2a4e, #3b1e5e);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Roboto', sans-serif;
            color: #cdd6f4;
            overflow: hidden;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(49, 50, 68, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(137, 180, 250, 0.5);
            text-align: center;
            max-width: 90%;
            width: 350px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #89b4fa;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(137, 180, 250, 0.7);
        }
        p {
            font-size: 16px;
            margin: 10px 0;
        }
        input {
            width: 80%;
            max-width: 280px;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: 2px solid #89b4fa;
            background: #1e1e2e;
            color: #cdd6f4;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #a6e3a1;
        }
        button {
            background: linear-gradient(45deg, #a6e3a1, #94e2d5);
            color: #1e1e2e;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 0 15px rgba(166, 227, 161, 0.7);
            transition: transform 0.2s, box-shadow 0.3s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(166, 227, 161, 1);
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            button, input {
                font-size: 16px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Overseas Hub</h1>
        <p>Join the Roblox server with Brainrot models!</p>
        <input type="text" id="jobIdInput" placeholder="Enter Job ID (or use URL param)" value="">
        <br>
        <button onclick="joinServer()">Join Server Now</button>
        <p id="status"></p>
    </div>

    <script>
        // CONFIG: Replace with your game's Place ID
        const PLACE_ID = 109983668079237;  // e.g., Steal a Brainrot

        // Extract and sanitize jobId from URL query param
        const urlParams = new URLSearchParams(window.location.search);
        let jobIdFromUrl = urlParams.get('jobId');
        if (jobIdFromUrl) {
            // Sanitize to prevent XSS or invalid characters
            jobIdFromUrl = jobIdFromUrl.replace(/[^a-zA-Z0-9\-]/g, '');
        }
        const jobIdInput = document.getElementById('jobIdInput');
        const status = document.getElementById('status');

        // Populate input with jobId if valid
        if (jobIdFromUrl) {
            jobIdInput.value = jobIdFromUrl;
            status.textContent = '✅ Job ID loaded from URL!';
            status.style.color = '#a6e3a1';
        } else {
            status.textContent = '⚠️ No Job ID in URL, enter manually.';
            status.style.color = '#f9e2af';
        }

        function joinServer() {
            let jobId = jobIdInput.value.trim();
            
            // Validate jobId
            if (!jobId || jobId.length < 10) {  // Basic length check for Roblox Job IDs
                status.textContent = '❌ Invalid Job ID! Please enter a valid ID.';
                status.style.color = '#f38ba8';
                return;
            }

            const url = `https://www.roblox.com/home?placeId=${PLACE_ID}&jobId=${encodeURIComponent(jobId)}`;
            status.textContent = '🚀 Redirecting to Roblox...';
            status.style.color = '#a6e3a1';
            
            setTimeout(() => {
                window.location.href = url;
            }, 1000);
        }

        // Auto-join if valid jobId is provided in URL
        if (jobIdFromUrl && jobIdFromUrl.length >= 10) {
            setTimeout(joinServer, 2000);
        }
    </script>
</body>
</html>
